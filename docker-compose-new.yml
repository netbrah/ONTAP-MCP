version: '3.8'

services:
  # NetApp ONTAP Key Manager MCP Server
  ontap-key-manager-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ontap-key-manager-mcp
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      # Server configuration
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      
      # ONTAP Cluster Configuration
      # This should be a JSON array of cluster configurations
      # Example: '[{"name":"cluster1","cluster_ip":"10.1.1.1","username":"admin","password":"pass","description":"Production Cluster"}]'
      - ONTAP_CLUSTERS=${ONTAP_CLUSTERS}
      
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:${PORT:-3000}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge

# Usage:
#   1. Copy .env.example to .env and configure your clusters
#   2. Run: docker-compose up -d
#   3. Access: http://localhost:3000/sse (SSE endpoint for MCP)
#
# View logs:
#   docker-compose logs -f
#
# Stop:
#   docker-compose down
