        schema:
          $ref: "#/definitions/error_response"

/security/aws-kms/{uuid}:
  get:
    tags: [ security ]
    description: |
      Retrieves the AWS KMS configuration for the SVM specified by the UUID.

      ### Related ONTAP commands
      * `security key-manager external aws show`
      * `security key-manager external aws check`
    operationId: aws_kms_get
    parameters:
      - name: uuid
        in: path
        type: string
        description: AWS KMS UUID
        required: true
      - $ref: "#/parameters/fields_param"
    responses:
      200:
        description: OK
        schema:
          $ref: "#/definitions/aws_kms"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_AWSKMS_REACHABILITY_FAILED_ON_NODES
            message: The Amazon Web Service Key Management Service is unreachable from one or more nodes.
          - name: KEYMANAGER_MESSAGE_EKMIP_SERVER_STATUS_UNAVAILABLE_ON_NODE
            message: Embedded KMIP server status not available.
          - name: KEYMANAGER_MESSAGE_UNAVAILABLE_PDEK_ON_NODES
            message: Top-level internal key protection key (KEK) unavailable on one or more nodes.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

  patch:
    tags: [ security ]
    description: |
      Updates the AWS KMS configuration.

      ### Optional properties
      * `region` - AWS region of the AWS KMS.
      * `service` - AWS service type.
      * `default_domain` - AWS KMS default domain.
      * `port` - AWS KMS port.
      * `proxy_type` - Type of proxy (http, https, etc.), if proxy configuration is used.
      * `proxy_host` - Proxy hostname if proxy configuration is used.
      * `proxy_port` - Proxy port number if proxy configuration is used.
      * `proxy_username` - Proxy username if proxy configuration is used.
      * `proxy_password` - Proxy password if proxy configuration is used.
      * `polling_period` - Polling period in minutes.
      * `timeout` - AWS Connection timeout, in seconds.
      * `verify` - Set to true to verify the AWS KMS host.
      * `verify_host` - Set to true to verify the AWS KMS host's hostname.
      * `verify_ip` - Set to true to verify the AWS KMS host's IP address.
      * `host` - AWS KMS host's hostname.
      * `secret_access_key` - AWS secret access key for the access key ID provided.
      * `access_key_id` - AWS access key ID of the user with the appropriate access to AWS KMS.
      * `skip_verify` - Set to true to bypass verification of the user provided access_key_id and secret_access_key.
      * `encryption_context` - Additional layer of authentication and logging.

      ### Related ONTAP commands
      * `security key-manager external aws update-config`
      * `security key-manager external aws update-credentials`

    operationId: aws_kms_modify
    parameters:
      - name: uuid
        in: path
        type: string
        description: AWS KMS UUID
        required: true
      - name: info
        in: body
        description: AWS KMS information
        schema:
          $ref: "#/definitions/aws_kms"
    responses:
      200:
        description: OK
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_NO_MODIFY_INPUTS_REST
            message: No inputs provided for the REST API PATCH request.
          - name: KEYMANAGER_MESSAGE_AWSKMS_NOT_CONFIGURED_REST
            message: Amazon Web Service Key Management Service is not configured for SVM.
          - name: KEYMANAGER_MESSAGE_AWSKMS_FAILED_TO_STORE_ACCESS_KEY
            message: Failed to store the secret access key.
          - name: KEYMANAGER_MESSAGE_AWSKMS_EMPTY_SECRET_ACCESS_KEY
            message: Secret access key cannot be empty.
          - name: KEYMANAGER_MESSAGE_AWSKMS_EMPTY_ACCESS_KEY_ID
            message: Access key ID cannot be empty.
          - name: KEYMANAGER_MESSAGE_AWSKMS_UNREACHABLE_UPDATE_CRED
            message: Unable to connect to the Amazon Web Service Key Management Service (AWSKMS) using these credentials.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

  delete:
    tags: [ security ]
    description: |
      Deletes an AWS KMS configuration.

