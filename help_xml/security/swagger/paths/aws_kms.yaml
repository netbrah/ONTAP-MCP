/security/aws-kms:
  x-ntap-long-description:
    tags: [ security ]
    description: |
      ## Overview
      Amazon Web Services Key Management Services (AWS KMS) is a cloud key
      management service (KMS) that provides a secure store for secrets. This
      feature allows ONTAP to securely store its encryption keys using AWS KMS.
      In order to use AWS KMS with ONTAP, you must first create a
      Customer Master Key (CMK) in AWS KMS and provide an Access Key ID and
      Secret Access Key for a user that has appropriate access to the newly
      created CMK in the AWS KMS."

      ## Examples
      ### Enabling AWS KMS for an SVM

      The following example shows how to enable AWS KMS at the SVM-scope. Note the <i>return_records=true</i> query parameter is used to obtain the newly created key manager configuration.
      ```
      # The API:
      POST /api/security/aws-kms
      # The call:
      curl -X POST 'https://<mgmt-ip>/api/security/aws-kms?return_records=true' -H 'accept: application/hal+json' -d '{"svm":{"uuid":"f36ff553-e713-11ea-bd56-005056bb4222" }, "region": "us-east-1", "key_id": "kmip-aws", "access_key_id": "<AWS-ACCESS-KEY-ID>", "secret_access_key": "<AWS-SECRET-ACCESS-KEY>"}'
      # The response:
      {
        "num_records": 1,
        "records": [
            {
            "uuid": "f72098a2-e908-11ea-bd56-005056bb4222",
            "svm": {
                "uuid": "f36ff553-e713-11ea-bd56-005056bb4222",
                "name": "vs0"
            },
            "region": "us-east-1",
            "key_id": "kmip-aws",
            "access_key_id": "<AWS-ACCESS-KEY-ID>",
            "_links": {
                "self": {
                "href": "/api/security/aws-kms/f72098a2-e908-11ea-bd56-005056bb4222"
                    }
                }
            }
        ]
      }
      ```
      ---
      ### Retrieving all AWS KMS configurations
      The following example shows how to retrieve all AWS KMS configurations.
      ```
      # The API:
      GET /api/security/aws-kms
      # The call:
      curl -X GET 'https://<mgmt-ip>/api/security/aws-kms?fields=*'
      # The response:
      {
        "records": [
            {
            "uuid": "f72098a2-e908-11ea-bd56-005056bb4222",
            "scope": "svm",
            "svm": {
                "uuid": "f36ff553-e713-11ea-bd56-005056bb4222",
                "name": "vs0"
            },
            "region": "us-east-1",
            "key_id": "kmip-aws",
            "access_key_id": "<AWS-ACCESS-KEY-ID>",
            "service": "KMS",
            "default_domain": "amazonaws.com",
            "polling_period": 60,
            "timeout": 10,
            "_links": {
                "self": {
                "href": "/api/security/aws-kms/f72098a2-e908-11ea-bd56-005056bb4222"
                    }
                }
            }
        ],
        "num_records": 1,
        "_links": {
            "self": {
            "href": "/api/security/aws-kms?fields=*"
            }
        }
      }
      ```
      ---
      ### Retrieving a specific AWS KMS configuration
      The following example shows how to retrieve information for a specific AWS KMS configuration.
      ```
      # The API:
      GET /api/security/aws-kms/{uuid}
      # The call:
      curl -X GET 'https://<mgmt-ip>/api/security/aws-kms/f72098a2-e908-11ea-bd56-005056bb4222?fields=*'
      # The response:
      {
        "uuid": "f72098a2-e908-11ea-bd56-005056bb4222",
        "scope": "svm",
        "svm": {
            "uuid": "f36ff553-e713-11ea-bd56-005056bb4222",
            "name": "vs0"
        },
        "region": "us-east-1",
        "key_id": "kmip-aws",
        "access_key_id": "<AWS-ACCESS-KEY-ID>",
        "service": "KMS",
        "default_domain": "amazonaws.com",
        "polling_period": 60,
        "timeout": 10,
        "_links": {
            "self": {
            "href": "/api/security/aws-kms/f72098a2-e908-11ea-bd56-005056bb4222"
            }
        }
      }
      ```
      ---
      ### Retrieving the advanced properties of an AWS configured for a specific SVM
      These values are not retrieved by default with the 'fields=*' option.
      The following example retrieves the advanced properties of a configured AWS for a specific SVM; there is an added computational cost in retrieving their values. The properties are not populated for either a collection GET or an instance GET unless they are explicitly requested using the `fields` query parameter or GET for all advanced properties is enabled.
      ```
      # The API:
      GET /api/security/aws-kms

      # The call:
      curl -X GET 'https://<mgmt-ip>/api/security/aws-kms/7052c6c0-a503-11ec-a68f-005056ac75a0/?fields=state,amazon_reachability,ekmip_reachability'

      # The response:
      {
        "uuid": "d70efc34-aa13-11ec-a059-005056ac7c32",
        "state": {
          "cluster_state": true,
          "message": "",
          "code": "0"
        },
        "amazon_reachability": {
          "reachable": true,
          "message": "",
          "code": "0"
        },
        "ekmip_reachability": [
          {
            "reachable": true,
            "message": "",
            "code": "0",
            "node": {
              "uuid": "817f544f-a98d-11ec-ae20-005056ac7c32",
              "name": "node1",
              "_links": {
                "self": {
                  "href": "/api/cluster/nodes/817f544f-a98d-11ec-ae20-005056ac7c32"
                }
              }
            }
          },
          {
            "reachable": true,
            "message": "",
            "code": "0",
            "node": {
              "uuid": "84b3f5f3-a98d-11ec-9ff4-005056acfbfe",
              "name": "node2",
              "_links": {
                "self": {
                  "href": "/api/cluster/nodes/84b3f5f3-a98d-11ec-9ff4-005056acfbfe"
                }
              }
            }
          }
        ],
        "_links": {
          "self": {
            "href": "/api/security/aws-kms/d70efc34-aa13-11ec-a059-005056ac7c32"
          }
        }
      }
      ```
      ---
      ### Updating the "access_key_id" of a specific AWS KMS configuration
      The following example shows how to update the "access_key_id" for a specific AWS KMS configuration.
      ```
      # The API:
      PATCH /api/security/aws-kms/{uuid}
      # The call:
      curl -X PATCH 'https://<mgmt-ip>/api/security/aws-kms/f72098a2-e908-11ea-bd56-005056bb4222/' -d '{"access_key_id": "<AWS-ACCESS-KEY-ID>", "secret_access_key": "<AWS-SECRET-ACCESS-KEY>"}'
      ```
      ---
      ### Updating a specific AWS KMS configuration to allow it to use a proxy.
      The following example shows how to update a specific AWS KMS configuration to allow the AWS KMS instance to use a proxy.
      ```
      # The API:
      PATCH /api/security/aws-kms/{uuid}
      # The call:
      curl -X PATCH 'https://<mgmt-ip>/api/security/aws-kms/f72098a2-e908-11ea-bd56-005056bb4222/' -d '{"default_domain": "216.9", "host": "172.20.216.9", "port": 8000, "service": "10", "verify_host": false, "verify_ip": false}'
      ```
      ---
      ### Deleting a specific AWS KMS configuration
      The following example shows how to delete a specific AWS KMS configuration.
      ```
      # The API:
      DELETE /api/security/aws-kms/{uuid}
      # The call;
      curl -X DELETE 'https://<mgmt-ip>/api/security/aws-kms/f72098a2-e908-11ea-bd56-005056bb4222'
      ```
      ---
      ### Restoring keys from a KMIP server
      The following example shows how to restore keys for a AWS KMS configuration.
      ```
      # The API:
      POST /api/security/aws-kms/{uuid}/restore
      # The call:
      curl -X POST 'https://<mgmt-ip>/api/security/aws-kms/33820b57-ec90-11ea-875e-005056bbf3f0/restore'
      ```
      ---

  post:
    tags: [ security ]
    description: |
      Configures the AWS KMS configuration for the specified SVM.

      ### Required properties
      * `access_key_id` - AWS access key ID of the user who has the appropriate access to AWS KMS.
      * `secret_access_key` - AWS secret access key for the access key ID provided.
      * `svm.uuid` or `svm.name` - Existing SVM in which to create an AWS KMS.
      * `region` - AWS region of the AWS KMS.
      * `key_id` - AWS Key ID

      ### Optional properties
      * `service` - AWS service type.
      * `default_domain` - AWS KMS default domain.
      * `host` - AWS KMS host's hostname.
      * `port` - AWS KMS port.
      * `proxy_type` - Type of proxy (http, https, etc.), if proxy configuration is used.
      * `proxy_host` - Proxy hostname if proxy configuration is used.
      * `proxy_port` - Proxy port number if proxy configuration is used.
      * `proxy_username` - Proxy username if proxy configuration is used.
      * `proxy_password` - Proxy password if proxy configuration is used.
      * `polling_period` - Polling period in minutes.
      * `encryption_context` - Additional layer of authentication and logging.

      ### Related ONTAP commands
      * `security key-manager external aws enable`
    operationId: aws_kms_create
    parameters:
      - name: info
        in: body
        description: Info specification
        schema:
          $ref: "#/definitions/aws_kms"
    responses:
      201:
        description: Created
        schema:
          $ref: "#/definitions/aws_kms_response"
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et,cert_ssl_errors.et
          - name: KEYMANAGER_MESSAGE_AWSKMS_INVALID_CONFIG
            message: Failed to enable the Amazon Web Service Key Management Service for an SVM due to an invalid secret access key.
          - name: KEYMANAGER_MESSAGE_AWSKMS_FEATURE_NOT_AVAILABLE
            message: The Amazon Web Service Key Management Service (AWSKMS) cannot be enabled because all nodes in the cluster are not running a version that supports the AWSKMS feature.
          - name: KEYMANAGER_MESSAGE_AWSKMS_CAP_NOT_SET
            message: The Amazon Web Service Key Management Service is disabled on the cluster. For further assistance, contact technical support.
          - name: KEYMANAGER_MESSAGE_AWSKMS_NOT_CONFIGURED_REST
            message: The Amazon Web Service Key Management Service is not configured for this SVM.
          - name: KEYMANAGER_MESSAGE_AWSKMS_UNSUPPORTED_ON_CSERVER
            message: The Amazon Web Service Key Management Service is not supported for the admin SVM.
          - name: KEYMANAGER_MESSAGE_AWSKMS_KM_ALREADY_CONFIGURED_REST
            message: Failed to configure Amazon Web Service Key Management Service for an SVM because a key manager has already been configured for the SVM.
          - name: KEYMANAGER_MESSAGE_AWSKMS_MCC_UNSUPPORTED
            message: The Amazon Web Service Key Management Service is not supported in MetroCluster configurations.
          - name: KEYMANAGER_MESSAGE_AWSKMS_VDEKS_IN_CSERVER_KM
            message: The Amazon Web Service Key Management Service cannot be configured for an SVM because one or more volume encryption keys of the SVM are stored on the admin SVM.
          - name: KEYMANAGER_MESSAGE_AWSKMS_FAILED_TO_STORE_ACCESS_KEY
            message: Failed to store the secret access key.
          - name: KEYMANAGER_MESSAGE_ERR_NODE_OOQ
            message: Nodes are out of quorum.
          - name: KEYMANAGER_MESSAGE_CLUSTER_LIF_MISSING
            message: Failed to find a LIF with Cluster role on node. One or more nodes may be out of quorum.
          - name: CERTIFICATE_SUBTYPE_NOT_SUPPORTED_FOR_CREATE
            message: Specifying \\\"-subtype\\\" when creating a certificate is not supported.
          - name: CERTIFICATE_SERIAL_SPECIFIED
            message: You cannot specify a value for serial as it is generated automatically.
          - name: CERTIFICATE_TYPE_NOT_SUPPORTED
            message: Certificate type not supported for create operation.
          - name: CERTIFICATE_UNSUPPORTED_KEY_SIZE
            message: Specified key size is not supported.
          - name: CERTIFICATE_FIPS_UNSUPPORTED_KEY_SIZE
            message: Specified key size is not supported in FIPS mode.
          - name: CERTIFICATE_FIPS_UNSUPPORTED_HASH_FUNCTION
            message: Specified hash function is not supported in FIPS mode.
          - name: KEYMANAGER_MESSAGE_KMIP_NAE_VOLUMES_FOUND_REST
            message: The key manager cannot be configured because the SVM has NAE volumes.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"
  get:
    tags: [ security ]
    description: |
      Retrieves all AWS KMS instances configured for all clusters and SVMs.

