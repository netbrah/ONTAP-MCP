          - name: VOLUME_ENCRYPTION_FAIL_NAE_REVERT_REST
            message: NAE aggregates found in the cluster.
          - name: VOLUME_ENCRYPTION_FAIL_ROOT_VOL
            message: One or more nodes in the cluster have the root volume encrypted using NVE (NetApp Volume Encryption).
          - name: KEYMANAGER_MESSAGE_FINDING_ENCRYPTED_VOLUMES_FAILED
