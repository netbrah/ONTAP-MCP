/security/aws-kms/{aws_kms.uuid}/rekey-external:
  post:
    tags: [ security ]
    description: |
      Rekeys or re-versions the AWS KMS Key Encryption Key (KEK) for the given AWS KMS.

      ### Related ONTAP commands
      * `security key-manager external aws rekey-external`

    operationId: aws_kms_rekey_external
    parameters:
      - name: aws_kms.uuid
        in: path
        type: string
        description: UUID of the existing AWS KMS configuration.
        required: true
      - name: info
        in: body
        description: AWS KMS information.
        required: true
        schema:
          $ref: "#/definitions/aws_kms_key"
    responses:
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
        x-ntap-go-skip-action: true
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_AWSKMS_NOT_CONFIGURED_REST
            message: AWS KMS is not configured for the given SVM.
          - name: KEYMANAGER_MESSAGE_REKEY_AFTER_MIGRATION_REST
            message: One or more volume encryption keys for encrypted volumes of this data SVM are stored in the key manager configured for the admin SVM. Use the REST API POST method to migrate this data SVM's keys from the admin SVM's key manager before running the rekey operation.
          - name: KEYMANAGER_MESSAGE_AWSKMS_REKEY_EXTERNAL_FAILED_ON_NODES_REST
            message: External rekey failed on one or more nodes.
          - name: KEYMANAGER_MESSAGE_MISSING_PDEK_ON_NODE
            message: Internal Error. Missing top-level internal key protection key (KEK) on a node.
          - name: KEYMANAGER_MESSAGE_ERR_GET_UNWRAPPED_KEY
            message: Internal error. Failed to get unwrapped key for a given key ID.
          - name: KEYMANAGER_MESSAGE_VSERVER_KEYSTORE_CONFIG_SWITCH_IN_PROGRESS_REKEY_REST
            message: Rekey cannot be performed on the SVM while the enabled keystore configuration is being switched. If a previous attempt to switch the keystore configuration failed, or was interrupted, the system will continue to prevent rekeying for the SVM. Use the REST API PATCH method "/api/security/key-stores/{uuid}" to re-run and complete the operation.
          - name: KEYMANAGER_MESSAGE_VSERVER_KEYSTORE_CONFIG_INITIALIZING_IN_PROGRESS_REKEY
            message: Rekey cannot be performed on the SVM while the enabled keystore configuration is being initialized. Wait until the keystore is in the active state, and rerun the rekey operation.
          - name: KEYMANAGER_MESSAGE_VSERVER_KEYSTORE_CONFIG_DISABLING_IN_PROGRESS_REKEY
            message: Rekey cannot be performed on the SVM while the enabled keystore configuration is being disabled.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

/security/aws-kms/{aws_kms.uuid}/rekey-internal:
  post:
    tags: [ security ]
    description: |
      Rekeys SVM KEK for the given AWS KMS.

      ### Related ONTAP commands
      * `security key-manager external aws rekey-internal`

    operationId: aws_kms_rekey_internal
    parameters:
      - name: aws_kms.uuid
        in: path
        type: string
        description: UUID of the existing AWS KMS configuration.
        required: true

    responses:
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
      default:
        description:  |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_AWSKMS_NOT_CONFIGURED_REST
            message: AWS KMS is not configured for the given SVM.
          - name: KEYMANAGER_MESSAGE_REKEY_WITHOUT_ENC_VOLUMES_REST
            message: There are no existing internal keys for the SVM. A rekey operation is allowed for an SVM with one or more encryption keys.
          - name: KEYMANAGER_MESSAGE_REKEY_AFTER_MIGRATION_REST
            message: One or more volume encryption keys for encrypted volumes of this data SVM are stored in the key manager configured for the admin SVM. Use the REST API POST method to migrate this data SVM's keys from the admin SVM's key manager to this data SVM's key manager before running the rekey operation.
          - name: KEYMANAGER_MESSAGE_REKEY_AFTER_BLOCKED
            message: Unable to successfully encrypt or decrypt because the configured external key manager for the given SVM is in a blocked state.
          - name: KEYMANAGER_MESSAGE_ALL_NODES_NOT_ONLINE
            message: Internal error. All nodes in the cluster are not currently online.
          - name: KEYMANAGER_MESSAGE_VSERVER_KEYSTORE_CONFIG_SWITCH_IN_PROGRESS_REKEY_REST
            message: Rekey cannot be performed on the SVM while the enabled keystore configuration is being switched. If a previous attempt to switch the keystore configuration failed, or was interrupted, the system will continue to prevent rekeying for the SVM. Use the REST API PATCH method "/api/security/key-stores/{uuid}" to re-run and complete the operation.
          - name: KEYMANAGER_MESSAGE_VSERVER_KEYSTORE_CONFIG_INITIALIZING_IN_PROGRESS_REKEY
            message: Rekey cannot be performed on the SVM while the enabled keystore configuration is being initialized. Wait until the keystore is in the active state, and rerun the rekey operation.
          - name: KEYMANAGER_MESSAGE_VSERVER_KEYSTORE_CONFIG_DISABLING_IN_PROGRESS_REKEY
            message: Rekey cannot be performed on the SVM while the enabled keystore configuration is being disabled.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"
