            message: External KMIP DKMIP keymanager not configured on administrative Vserver.
          - name: KEYMANAGER_MESSAGE_AUTH_KEYS_GET_ERROR
            message: Internal error while accessing keymanager database.
          - name: KEYMANAGER_MESSAGE_AUTH_KEYS_UUID_NOT_SERVER
            message: The UUID provided is not associated with the administrator SVM key manager.
          - name: KEYMANAGER_MESSAGE_KEYSERVER_UNAVAILABLE_REST
            message: One or more key servers are unavailable.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

