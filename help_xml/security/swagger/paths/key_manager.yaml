/security/key-managers/{security_key_manager.uuid}/auth-keys:
  x-ntap-long-description:
    tags: [ security ]
    description: |
      ## Overview
      Used to create and list authentication keys (NSE-AK).

      ## Example

      ### Creates an authentication key. Note: an external key  manager must be configured on the admin SVM, as the authentication key will be associated with the admin SVM.

      The following example shows how to create an authentication key.
      ```
      # The API:
      POST /api/security/key-managers/{security_key_manager.uuid}/auth-keys

      # The call:
      curl -X POST 'https://<mgmt-ip>/api/security/key-managers/5fb1701a-d922-11e8-bfe8-005056bb017d/auth-keys?return_timeout=15&return_records=true' -H 'accept: application/hal+json'

      # The response:
      {
        "num_records": 1,
        "records": [
          {
            "key_id": "00000000000000000200000000000100531d8cdc38437c2627b6b1726dd2675c0000000000000000",
            "key_tag": "vsim1"
          }
        ]
      }
      ```
      ---
      ### Retrieving a list of all of the authentication keys associated with the admin SVM.
      The following example shows how to retrieve a list of all of the authentication keys associated with the admin SVM.
      ```
      # The API:
      GET /api/security/key-managers/{security_key_manager.uuid}/auth-keys

      # The call:
      curl -X GET 'https://<mgmt-ip>/api/security/key-managers/5fb1701a-d922-11e8-bfe8-005056bb017d/auth-keys?fields=*' -H 'accept: application/hal+json'

      # The response:
      {
        "num_records": 2,
        "records": [
          {
            "security_key_manager": {
              "uuid": "d36a654d-14b4-11ed-b82e-005056bb8f59"
            },
            "key_id": "00000000000000000200000000000100052ab79fc51a430dbb16f1c0d2054cfe0000000000000000",
            "key_tag": "vsim1"
          },
          {
            "security_key_manager": {
              "uuid": "d36a654d-14b4-11ed-b82e-005056bb8f59"
            },
            "key_id": "000000000000000002000000000001003f32ce2dc55d2764c07da74e722c179b0000000000000000",
            "key_tag": "vsim1"
          }
        ]
      }
      ```
      ---
      ### Retrieving a specific authentication key associated with the admin SVM.
      The following example shows how to a specific authentication key associated with the admin SVM and return the key-tag.
      ```
      # The API:
      GET /api/security/key-managers/{security_key_manager.uuid}/auth-keys/{key-id}

      # The call:
      curl -X GET 'https://<mgmt-ip>/api/security/key-managers/5fb1701a-d922-11e8-bfe8-005056bb017d/auth-keys/0000000000000000020000000000010041a2dda969b0d179db8f1c78d629d0f10000000000000000?fields=key_tag' -H 'accept: application/hal+json'

      # The response:
      {
        "security_key_manager": {
          "uuid": "d36a654d-14b4-11ed-b82e-005056bb8f59"
        },
        "key_id": "0000000000000000020000000000010041a2dda969b0d179db8f1c78d629d0f10000000000000000",
        "key_tag": "vsim1"
      }

  post:
    tags: [ security ]
    description: |
      Creates an authentication key.

      ### Related ONTAP commands
      * `security key-manager key create`

      ### Required properties
      * `security_key_manager.uuid` - UUID of the external key manager.

    operationId: key_manager_auth_key_create

    parameters:
      - name: security_key_manager.uuid
        in: path
        type: string
        description: External key manager UUID
        required: true
      - name: info
        in: body
        description: Information specification
        schema:
          $ref: "#/definitions/key_manager_auth_key"
    responses:
      201:
        description: Created
        schema:
          $ref: "#/definitions/key_manager_auth_key_response"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et,kmip_messages.et
          - name: KEYMANAGER_MESSAGE_EXTERNAL_NOT_CONFIGURED
            message: External key management is not enabled for the SVM.
          - name: KEYMANAGER_MESSAGE_NO_KEYSERVER_FOUND
            message: No key servers found for the SVM.
          - name: KEYMANAGER_MESSAGE_CONFIGURE_KM_ON_PARTNER_SITE
            message: External key management is not configured on the partner site.
          - name: KEYMANAGER_MESSAGE_CREATEKEY_ERR_KEY_TAG_INVALID_CHAR
            message: The key tag value provided contains invalid characters.
          - name: KEYMANAGER_MESSAGE_ERR_KEYID_GEN_AK_FAILED
            message: Failed to create a key-id for the authentication key.
          - name: KEYMANAGER_MESSAGE_ERR_KEYGEN_AK_FAILED
            message: Failed to create authentication key.
          - name: KEYMANAGER_MESSAGE_PUSH_TO_KEY_SERVER_FAILED
            message: Failed to push authentication key to any registered key servers.
          - name: KEYMANAGER_MESSAGE_ERR_KEYGEN_NSE_AK_CRYPTO_CLEANUP_FAILED
            message: Error cleaning up key database after key creation error.
          - name: KEYMANAGER_MESSAGE_CREATEKEY_ERR_PASSPHRASE_LEN
            message: Invalid passphrase length; passphrase must be 20-32 ASCII-range characters.
          - name: KEYMANAGER_MESSAGE_ERROR_CREATEKEY_ERR_CANT_READ_AKS
            message: Unable to determine the current number of configured authentication keys.
          - name: KEYMANAGER_MESSAGE_ERROR_MAX_KEY_LIMIT
            message: The maximum number of authentication keys are already configured.
          - name: KMIP_MESSAGE_FAILED_TO_PUSH_AK
