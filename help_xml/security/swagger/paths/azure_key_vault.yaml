  post:
    tags: [ security ]
    description: |
      Configures the AKV configuration for all clusters and SVMs.

      ### Required properties:
      * `svm.uuid` or `svm.name` - Existing SVM in which to create a AKV.
      * `client_id` - Application (client) ID of the deployed Azure application with appropriate access to an AKV.
      * `tenant_id` - Directory (tenant) ID of the deployed Azure application with appropriate access to an AKV.
      * `client_secret` or `client_certificate` - Secret or PKCS12 Certificate used by the application to prove its identity to AKV.
      * `key_id`- Key Identifier of AKV encryption key.
      * `name` - Name of the deployed AKV used by ONTAP for storing keys.

      ### Optional properties:
      * `port` - Authorization server and vault port number.
      * `oauth_host` - Open authorization server host name.
      * `vault_host` - AKV host subdomain.
      * `proxy_type` - Type of proxy (http, https etc.) if proxy configuration is used.
      * `proxy_host` - Proxy hostname if proxy configuration is used.
      * `proxy_port` - Proxy port number if proxy configuration is used.
      * `proxy_username` - Proxy username if proxy configuration is used.
      * `proxy_password` - Proxy password if proxy configuration is used.
      * `configuration.name` - The configuration name to use when also setting the `create_inactive` flag.

      ### Optional parameters:
      * `create_inactive` - Create an AKV configuration without enabling it. This flag is set to "false" by default.

      ### Related ONTAP commands
      * `security key-manager external azure enable (DEPRECATED)`
      * `security key-manager keystore enable`
      * `security key-manager external azure create-config`
      * `security key-manager external azure update-config`

    operationId: azure_key_vault_create
    parameters:
      - name: create_inactive
        in: query
        type: boolean
        description: Indicates whether to create an active or inactive configuration.
        required: false
      - name: info
        in: body
        description: Info specification
        schema:
          $ref: "#/definitions/azure_key_vault"
    responses:
      201:
        description: Created
        schema:
          $ref: "#/definitions/azure_key_vault_response"
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et,cert_ssl_errors.et,libsslmgnt_ui_errors.et
          - name: KEYMANAGER_MESSAGE_AKV_CAP_CHECK_FAILED
            message: Failed to check if the Azure Key Vault feature is enabled.
          - name: KEYMANAGER_MESSAGE_AKV_CAP_ENABLE_FAILED
            message: Failed to enable Azure Key Vault feature.
          - name: KEYMANAGER_MESSAGE_KM_ALREADY_CONFIGURED
            message: A key manager has already been configured for this SVM.
          - name: KEYMANAGER_MESSAGE_AKV_MCC_UNSUPPORTED
            message: AKV is not supported in MetroCluster configurations.
          - name: CERTIFICATE_FAILED_TO_CREATE_SELF_SIGNED
            message: Failed to create self-signed certificate.
          - name: CERTIFICATE_FIPS_UNSUPPORTED_KEY_SIZE
            message: The specified key size is not supported in FIPS mode.
          - name: CERTIFICATE_FIPS_UNSUPPORTED_HASH_FUNCTION
            message: The specified hash function is not supported in FIPS mode.
          - name: CERTIFICATE_UNSUPPORTED_KEY_SIZE
            message: The specified key size is not supported.
          - name: LIBSSLMGNT_UI_X509_TOO_EARLY
            message: The certificates start date is later than the current date.
          - name: KEYMANAGER_MESSAGE_CLUSTER_LIF_MISSING
            message: Failed to find an interface with Cluster role.
          - name: KEYMANAGER_MESSAGE_AKV_FAILED_TO_STORE_SECRET
            message: Internal error. Failed to store configuration in internal database.
          - name: KEYMANAGER_MESSAGE_AKV_INVALID_KEY_ID_FORMAT
            message: Invalid key ID format. Example key ID format\":" "https://mykeyvault.vault.azure.net/keys/key1/a8e619fd8f234db3b0b95c59540e2a74".
          - name: KEYMANAGER_MESSAGE_AKV_MISSING_AUTHENTICATION_METHOD_REST
            message: No authentication method provided.
          - name: KEYMANAGER_MESSAGE_AKV_INVALID_CLIENT_CERTIFICATE
            message: Invalid client certificate.
          - name: KEYMANAGER_MESSAGE_CONFIG_NAME_EMPTY_REST
            message: The configuration.name field cannot be an empty string.
          - name: KEYMANAGER_MESSAGE_CONFIG_NAME_RESERVED
            message: The configuration.name is reserved for use by the system.
          - name: KEYMANAGER_MESSAGE_AKV_CONFIG_ALREADY_EXISTS
            message: The specified configuration.name already exists on the given SVM.
          - name: KEYMANAGER_MESSAGE_AKV_CONFIG_NAME_REQUIRED_REST
            message: The configuration.name field is required when the create_inactive flag is set to true.
          - name: KEYMANAGER_MESSAGE_AKV_CONFIG_NAME_NOT_ALLOWED_REST
            message: The configuration.name field can only be specified when the create_inactive flag is set to true.
          - name: KEYMANAGER_MESSAGE_KMIP_NAE_VOLUMES_FOUND_REST
            message: The key manager cannot be configured because the SVM has NAE volumes.
          - name: KEYMANAGER_MESSAGE_AKV_INVALID_VAULT_NAME_FORMAT
            message: Invalid vault name format. Example vault name format\":" "https://mykeyvault.vault.azure.net".
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

  get:
    tags: [ security ]
    description: |
      Retrieves AKVs configured for all clusters and SVMs.

      ### Related ONTAP commands
      * `security key-manager external azure show`
      * `security key-manager external azure check`
    operationId: azure_key_vault_collection_get
    parameters:
      - x-ntap-autogen-params: azure_key_vault
      - $ref: "#/parameters/fields_param"
      - $ref: "#/parameters/max_records_param"
      - $ref: "#/parameters/return_timeout_get_param"
      - $ref: "#/parameters/return_records_get_param"
      - $ref: "#/parameters/order_by_param"
    responses:
      200:
        description: OK
        schema:
          $ref: "#/definitions/azure_key_vault_response"
      default:
        description:  |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_AKV_REACHABILITY_FAILED_ON_NODES
            message: The Azure Key Vault Key Management Service is unreachable from one or more nodes.
          - name: KEYMANAGER_MESSAGE_EKMIP_SERVER_STATUS_UNAVAILABLE_ON_NODE
            message: Embedded KMIP server status not available.
          - name: KEYMANAGER_MESSAGE_UNAVAILABLE_PDEK_ON_NODES
            message: Top-level internal key protection key (KEK) unavailable on one or more nodes.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

/security/azure-key-vaults/{uuid}:
  get:
    tags: [ security ]
    description: |
      Retrieves the AKV configuration for the SVM specified by the UUID.

      ### Related ONTAP commands
      * `security key-manager external azure show`
      * `security key-manager external azure check`
    operationId: azure_key_vault_get
    parameters:
      - name: uuid
        in: path
        type: string
        description: AKV UUID
        required: true
      - $ref: "#/parameters/fields_param"
    responses:
      200:
        description: OK
        schema:
          $ref: "#/definitions/azure_key_vault"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_AKV_REACHABILITY_FAILED_ON_NODES
            message: The Azure Key Vault Key Management Service is unreachable from one or more nodes.
          - name: KEYMANAGER_MESSAGE_EKMIP_SERVER_STATUS_UNAVAILABLE_ON_NODE
            message: Embedded KMIP server status not available.
          - name: KEYMANAGER_MESSAGE_UNAVAILABLE_PDEK_ON_NODES
            message: Top-level internal key protection key (KEK) unavailable on one or more nodes.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

  patch:
    tags: [ security ]
    description: |
      Updates the AKV configuration.

      ### Optional properties
      * `client_secret` or `client_certificate` - New secret or new PKCS12 certificate used to prove the application's identity to the AKV.
      * `proxy_type` - Type of proxy (http, https etc.) if proxy configuration is used.
      * `proxy_host` - Proxy hostname if proxy configuration is used.
      * `proxy_port` - Proxy port number if proxy configuration is used.
      * `port` - Authorization server and vault port number.
      * `oauth_host` - Open authorization server host name.
      * `vault_host` - AKV host subdomain.
      * `verify_host` - Verify the identity of the AKV host name.
      * `verify_ip ` - Verify the identity of the AKV IP address.
      * `proxy_username` - Proxy username if proxy configuration is used.
      * `proxy_password` - Proxy password if proxy configuration is used.
      * `client_id` - Application (client) ID of the deployed Azure application with appropriate access to an AKV.
      * `tenant_id` - Directory (tenant) ID of the deployed Azure application with appropriate access to an AKV.
      * `skip_verification` - Skip the verification of the updated credentials, set to true to bypass the verification. The default value is false.

      ### Related ONTAP commands
      * `security key-manager external azure update-client-secret`
      * `security key-manager external azure update-credentials`
      * `security key-manager external azure update-config`

    operationId: azure_key_vault_modify
    parameters:
      - name: uuid
        in: path
        type: string
        description: AKV UUID
        required: true
      - name: info
        in: body
        description: AKV information
        schema:
          $ref: "#/definitions/azure_key_vault"
    responses:
      200:
        description: OK
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_AKV_MISSING_NEW_SECRET_REST
            message: The field \"client_secret\" must be specified.
          - name: KEYMANAGER_MESSAGE_AKV_NOT_CONFIGURED_REST
            message: Azure Key Vault is not configured for the given SVM.
          - name: KEYMANAGER_MESSAGE_AKV_FAILED_TO_STORE_SECRET
            message: Internal error. Failed to store configuration in internal database.
          - name: KEYMANAGER_MESSAGE_AKV_INVALID_SECRET
            message: Invalid client secret.
          - name: KEYMANAGER_MESSAGE_AKV_INVALID_CLIENT_CERTIFICATE
            message: Invalid client certificate.
          - name: KEYMANAGER_MESSAGE_NO_MODIFY_INPUTS_REST
            message: No inputs were provided for the patch request.
          - name: KEYMANAGER_MESSAGE_REKEY_AFTER_MIGRATION_REST
            message: One or more volume encryption keys for encrypted volumes of this data SVM are stored in the key manager configured for the admin SVM. Use the REST API POST method to migrate this data SVM's keys from the admin SVM's key manager to this data SVM's key manager before running the rekey operation.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

  delete:
    tags: [ security ]
    description: |
      Deletes an AKV configuration.

      ### Related ONTAP commands
      * `security key-manager external azure disable (DEPRECATED)`
      * `security key-manager keystore disable`
      * `security key-manager keystore delete`
    operationId: azure_key_vault_delete
    parameters:
      - name: uuid
        in: path
        description: AKV UUID
        required: true
        type: string
    responses:
      200:
        description: OK
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et,volume_encryption.et
          - name: KEYMANAGER_MESSAGE_AKV_NOT_CONFIGURED_REST
            message: Azure Key Vault is not configured for the given SVM.
          - name: KEYMANAGER_MESSAGE_NSE_AK_IS_SET
            message: One or more self-encrypting drives are assigned an authentication key.
          - name: KEYMANAGER_MESSAGE_NSE_AK_UNKNOWN
            message: Cannot determine authentication key presence on one or more self-encrypting drives.
          - name: KEYMANAGER_MESSAGE_UNABLE_TO_RETRIEVE_EXISTING_HOSTPORT
            message: Internal error. Failed to get existing key-server details for the given SVM.
          - name: KEYMANAGER_MESSAGE_ERR_KEYSERVER_REMOVE_WITH_NSE_AK
            message: Cannot remove key manager that still contains one or more NSE authentication keys.
          - name: KEYMANAGER_MESSAGE_SAFE_TO_DISABLE_CHECK_FAILED
