  patch:
    tags: [ security ]
    description: |
      Updates the IBM Key Protect Key Management Service configuration.

      ### Optional properties
      * `api_key` - API key of the IKP KMS configuration
      * `proxy_type`` - Type of proxy (http/https) if proxy configuration is used.
      * `proxy_host` - Proxy hostname if proxy configuration is used.
      * `proxy_port` - Proxy port number if proxy configuration is used.
      * `proxy_username` - Proxy username if proxy configuration is used.
      * `proxy_password` - Proxy password if proxy configuration is used.

      ### Related ONTAP commands
      * `security key-manager external ikp update-config`
      * `security key-manager external ikp update-credentials`
    operationId: ikp_kms_modify
    parameters:
      - name: uuid
        in: path
        type: string
        description: IBM Key Protect Key Management Service UUID
        required: true
      - name: info
        in: body
        description: IBM Key Protect Key Management Service information
        schema:
          $ref: "#/definitions/ikp_kms"
    responses:
      200:
        description: OK
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_IKPKMS_NOT_CONFIGURED
            message: The IBM Key Protect Key Management Service is not configured for the SVM.
          - name: KEYMANAGER_MESSAGE_IKPKMS_NO_SECRET_API_KEY
            message: The secret API key was not provided.
          - name: KEYMANAGER_MESSAGE_IKPKMS_UNREACHABLE_UPDATE_CRED
            message: Unable to connect to the IBM Key Protect Key Management Service with updated credentials.
          - name: KEYMANAGER_MESSAGE_NO_MODIFY_INPUTS_REST
            message: No inputs were provided for the patch request.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

  delete:
    tags: [ security ]
    description: |
      Deletes the IBM Key Protect Key Management Service configuration.

      ### Related ONTAP commands
      * `security key-manager external ikp disable`
    operationId: ikp_kms_delete
    parameters:
      - name: uuid
        in: path
        description: IBM Key Protect Key Management Service UUID
        required: true
        type: string
    responses:
      200:
        description: OK
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_IKPKMS_NOT_CONFIGURED
            message: The IBM Key Protect Key Management Service is not configured for the SVM.
          - name: KEYMANAGER_MESSAGE_CKM_FOUND_SVM_KEK_IN_MIXED_STATE
            message: Internal error. The keymanager configured is in a mixed state and has an SVM key.
          - name: KEYMANAGER_MESSAGE_FINDING_ENCRYPTED_VOLUMES_FAILED
            message: Internal error. Failed to determine if the given SVM has any encrypted volumes.
          - name: KEYMANAGER_MESSAGE_VDEKS_ON_KEYMANAGER_REST
            message: Volume encryption keys (VEK) for one or more encrypted volumes are stored on the key manager configured for the given SVM.
          - name: KEYMANAGER_MESSAGE_ERR_VOL_KEY_ID_INVALID
            message: Internal error. Volume encryption key is invalid for a volume.
          - name: KEYMANAGER_MESSAGE_ERR_VOL_KEY_ID_MISSING
            message: Internal error. Volume encryption key is missing for a volume.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

