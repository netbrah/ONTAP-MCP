/security/ikp-kms:
  x-ntap-visibility:
    type: private
  x-ntap-long-description:
    tags: [ security ]
    description: |
      ## Overview
      IBM Key Protect Key Management Service (IKPKMS) is a cloud key management service that provides a secure
      store for secrets. This feature allows ONTAP to securely store its encryption
      keys using IKPKMS. In order to use IKPKMS with ONTAP, you must first create an IKPKMS instance
      with a root key and provide the IKPKMS instance ID, root key name, and an API key for a
      service ID with appropriate permissions for the newly created IKPKMS instance.

      ## Examples TODO
      ### Enabling IKP KMS for an SVM

      The following example shows how to enable IKP KMS at the SVM-scope. Note the <i>return_records=true</i> query parameter is used to obtain the newly created key manager configuration.
      ```
      # The API:
      POST /api/security/ikp-kms
      # The call:
      curl -X POST 'https://<mgmt-ip>/api/security/ikp-kms?return_records=true' -H 'accept: application/hal+json' -d '{"region": "test_region", "instance_id": "test_instance_id", "key_id": "12345678-1234-1234-1234-123456789101", "api_key": "test_api_key", "svm": {"name": "vs0"}}'
      # The response:
      {
        "num_records": 1,
        "records": [
          {
            "uuid": "347f8eda-e6b2-11ec-9217-005056a76d00",
            "svm": {
              "name": "vs0"
            },
            "region": "test_region",
            "instance_id": "test_instance_id",
            "key_id": "12345678-1234-1234-1234-123456789101",
            "_links": {
              "self": {
                "href": "/api/security/ikp-kms/347f8eda-e6b2-11ec-9217-005056a76d00"
              }
            }
          }
        ]
      }
      ```
      ---
      ### Retrieving all IKP KMS configurations
      The following example shows how to retrieve the non-advanced properties for all IKP KMS configurations.
      ```
      # The API:
      GET /api/security/ikp-kms
      # The call:
      curl -X GET 'https://<mgmt-ip>/api/security/ikp-kms?fields=*'
      # The response:
      {
        "records": [
          {
            "uuid": "347f8eda-e6b2-11ec-9217-005056a76d00",
            "km_name": "",
            "scope": "svm",
            "svm": {
              "uuid": "6549ce9d-e1c1-11ec-a532-005056a76d00",
              "name": "vs0"
            },
            "region": "test_region",
            "instance_id": "test_instance_id",
            "key_id": "12345678-1234-1234-1234-123456789101",
            "polling_period": 60,
            "timeout": 10,
            "_links": {
              "self": {
                "href": "/api/security/ikp-kms/347f8eda-e6b2-11ec-9217-005056a76d00"
              }
            }
          }
        ],
        "num_records": 1,
        "_links": {
          "self": {
            "href": "/api/security/ikp-kms?fields=*&return_records=true"
          }
        }
      }
      ```
      ---
      ### Retrieving a specific IKP KMS configuration
      The following example shows how to retrieve non-advances properties for a specific IKP KMS configuration.
      ```
      # The API:
      GET /api/security/ikp-kms/{uuid}
      # The call:
      curl -X GET 'https://<mgmt-ip>/api/security/ikp-kms/347f8eda-e6b2-11ec-9217-005056a76d00?fields=*'
      # The response:
      {
        "uuid": "347f8eda-e6b2-11ec-9217-005056a76d00",
        "km_name": "",
        "scope": "svm",
        "svm": {
          "uuid": "6549ce9d-e1c1-11ec-a532-005056a76d00",
          "name": "vs0"
        },
        "region": "test_region",
        "instance_id": "test_instance_id",
        "key_id": "12345678-1234-1234-1234-123456789101",
        "polling_period": 60,
        "timeout": 10,
        "_links": {
          "self": {
            "href": "/api/security/ikp-kms/347f8eda-e6b2-11ec-9217-005056a76d00"
          }
        }
      }
      ```
      ---
      ### Retrieving the advanced properties of an IKP configured for a specific SVM
      These values are not retrieved by default with the 'fields=*' option.
      The following example retrieves the advanced properties of a configured IKP for a specific SVM; there is an added computational cost in retrieving their values. The properties are not populated for either a collection GET or an instance GET unless they are explicitly requested using the `fields` query parameter or GET for all advanced properties is enabled.
      ```
      # The API:
      GET /api/security/ikp-kms

      # The call:
      curl -X GET 'https://<mgmt-ip>/api/security/ikp-kms/347f8eda-e6b2-11ec-9217-005056a76d00/?fields=state,amazon_reachability,ekmip_reachability'

      # The response:
      {
        "uuid": "347f8eda-e6b2-11ec-9217-005056a76d00",
        "state": {
          "cluster_state": true,
          "message": "",
          "code": "0"
        },
        "ikp_reachability": {
          "reachable": true,
          "message": "",
          "code": "0"
        },
        "ekmip_reachability": [
          {
            "reachable": true,
            "message": "",
            "code": "0",
            "node": {
              "uuid": "817f544f-a98d-11ec-ae20-005056ac7c32",
              "name": "node1",
              "_links": {
                "self": {
                  "href": "/api/cluster/nodes/817f544f-a98d-11ec-ae20-005056ac7c32"
                }
              }
            }
          }
        ],
        "_links": {
          "self": {
            "href": "/api/security/ikp-kms/347f8eda-e6b2-11ec-9217-005056a76d00"
          }
        }
      }
      ```
      ---
      ### Updating the API key of a specific IKPKMS configuration
      The following example shows how to update the application credentials for a specific IKPKMS configuration:
      ```
      # The API:
      PATCH /api/security/ikp-kms/{uuid}
      # The call:
      curl -X PATCH 'https://<mgmt-ip>/api/security/ikp-kms/33820b57-ec90-11ea-875e-005056bbf3f0' -d '{"api_key": "myNewApiKey"}'
      ```
      ---
      ### Deleting a specific IKPKMS configuration
      The following example shows how to delete a specific IKPKMS configuration:
      ```
      # The API:
      DELETE /api/security/ikp-kms/{uuid}
      # The call:
      curl -X DELETE 'https://<mgmt-ip>/api/security/ikp-kms/33820b57-ec90-11ea-875e-005056bbf3f0'
      ```
      ---
      ### Restoring keys from a KMIP server
      The following example shows how to restore keys for an IKPKMS configuration:
      ```
      # The API:
      POST /api/security/ikp-kms/{uuid}/restore
      # The call:
      curl -X POST 'https://<mgmt-ip>/api/security/ikp-kms/33820b57-ec90-11ea-875e-005056bbf3f0/restore'
      ```
      ---
  post:
    tags: [ security ]
    description: |
      Configures the IBM Key Protect Key Management Service configuration for the specified SVM.

      ### Required properties
      * `svm.uuid` or `svm.name` - Existing SVM for which to create an IBM Key Protect Key Management Service instance.
      * `region` - Region of IBM Key Protect Key Management Service instance.
      * `instance_id` - IBM Key Protect Key Management Service instance ID.
      * `api_key` - IBM Key Protect Key Management Service API key.
      * `key_id` - IBM Key Protect Key Management Service Key ID.

      ### Optional properties
      * `proxy_type` - Type of proxy (http/https) if proxy configuration is used.
      * `proxy_host` - Proxy hostname if proxy configuration is used.
      * `proxy_port` - Proxy port number if proxy configuration is used.
      * `proxy_username` - Proxy username if proxy configuration is used.
      * `proxy_password` - Proxy password if proxy configuration is used.

      ### Related ONTAP commands
      * `security key-manager external ikp enable`
    operationId: ikp_kms_create
    parameters:
      - name: info
        in: body
        description: Info specification
        schema:
          $ref: "#/definitions/ikp_kms"
    responses:
      201:
        description: Created
        schema:
          $ref: "#/definitions/ikp_kms_response"
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_IKPKMS_KEY_ID_NOT_UUID
            message: Key-id provided was not a UUID.
          - name: KEYMANAGER_MESSAGE_IKPKMS_FEATURE_NOT_AVAILABLE
            message: Not all nodes are running a version that supports IKPKMS.
          - name: KEYMANAGER_MESSAGE_IKPKMS_CAP_NOT_SET
            message: The IBM Key Protect Key Management Service capability is not enabled.
          - name: KEYMANAGER_MESSAGE_IKPKMS_UNSUPPORTED_ON_CSERVER_REST
            message: The IBM Key Protect Key Management Service is not supported on the Admin SVM.
          - name: KEYMANAGER_MESSAGE_IKPKMS_KM_ALREADY_CONFIGURED_REST
            message: An IBM Key Protect Key Management Service instance already exists on the SVM.
          - name: KEYMANAGER_MESSAGE_IKPKMS_MCC_UNSUPPORTED
            message: MCC is enabled, and is not compatible with the IBM Key Protect Key Management Service.
          - name: KEYMANAGER_MESSAGE_ERR_NODE_OOQ
            message: Not all nodes are in quorum.
          - name: KEYMANAGER_MESSAGE_ERR_CANNOT_DETERMINE_NODE_COUNT
            message: Internal error. Cannot determine node count.
          - name: KEYMANAGER_MESSAGE_IKPKMS_NO_SECRET_API_KEY
            message: The secret API key was not provided.
          - name: KEYMANAGER_MESSAGE_CLUSTER_LIF_MISSING
            message: A LIF with Cluster role was not found.
          - name: KEYMANAGER_MESSAGE_IKPKMS_FAILED_TO_RETRIEVE_SECRET_API_KEY
            message: Internal error. The secret API key was not able to be retrieved.
          - name: KEYMANAGER_MESSAGE_KMIP_NAE_VOLUMES_FOUND_REST
            message: The key manager cannot be configured because the SVM has NAE volumes.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"
  get:
    tags: [ security ]
    description: |
      Retrieves all IBM Key Protect Key Management Service instances configured for all clusters and SVMs.

      ### Related ONTAP commands
      * `security key-manager external ikp show`
      * `security key-manager external ikp check`
    operationId: ikp_kms_collection_get
    parameters:
      - x-ntap-autogen-params: ikp_kms
      - $ref: "#/parameters/fields_param"
      - $ref: "#/parameters/max_records_param"
      - $ref: "#/parameters/return_timeout_get_param"
      - $ref: "#/parameters/return_records_get_param"
      - $ref: "#/parameters/order_by_param"
    responses:
      200:
        description: OK
        schema:
          $ref: "#/definitions/ikp_kms_response"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_IKPKMS_REACHABILITY_FAILED_ON_NODES
            message: The IBM Key Protect Key Management Service unreachable from the SVM.
          - name: KEYMANAGER_MESSAGE_EKMIP_SERVER_STATUS_UNAVAILABLE_ON_NODE
            message: Embedded KMIP server status not available.
          - name: KEYMANAGER_MESSAGE_UNAVAILABLE_PDEK_ON_NODES
            message: Top-level internal key protection key (KEK) unavailable on node.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

