/security/ikp-kms/{ikp_kms.uuid}/rekey-external:
  x-ntap-visibility:
    type: private
  post:
    tags: [ security ]
    description: |
      Rekeys or re-versions the IBM Key Protect Key Management Service key encryption key (KEK) for the given SVM.

      ### Related ONTAP commands
      * `security key-manager external ikp rekey-external`

    operationId: ikp_kms_rekey_external
    parameters:
      - name: ikp_kms.uuid
        in: path
        type: string
        description: UUID of the existing IBM Key Protect Key Management Service configuration.
        required: true
      - name: info
        in: body
        description: IKP KMS information
        required: true
        schema:
          $ref: "#/definitions/ikp_kms_key"
    responses:
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
        x-ntap-go-skip-action: true
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_IKPKMS_NOT_CONFIGURED
            message: The IBM Key Protect Key Management Service is not configured for the given SVM.
          - name: KEYMANAGER_MESSAGE_REKEY_AFTER_MIGRATION_REST
            message: One or more volume encryption keys for encrypted volumes of this data SVM are stored in the key manager configured for the admin SVM. Use the REST API POST method to migrate this data SVM's keys from the admin SVM's key manager before running the rekey operation.
          - name: KEYMANAGER_MESSAGE_IKPKMS_REKEY_EXTERNAL_FAILED_ON_NODES_REST
            message: External rekey failed on one or more nodes.
          - name: KEYMANAGER_MESSAGE_REKEY_AFTER_BLOCKED
            message: The IBM Key Protect Key Management Service is in a blocked state.
          - name: KEYMANAGER_MESSAGE_REKEY_WITHOUT_ENC_VOLUMES_REST
            message: There are no existing internal keys for the SVM. A rekey operation is allowed for an SVM with one or more encryption keys.
          - name: KEYMANAGER_MESSAGE_ALL_NODES_NOT_ONLINE_REST
            message: Internal error. Not all nodes in the cluster are currently online.
          - name: KEYMANAGER_MESSAGE_VSERVER_KEYSTORE_CONFIG_SWITCH_IN_PROGRESS_REKEY_REST
            message: Rekey cannot be performed on the SVM while the enabled keystore configuration is being switched. If a previous attempt to switch the keystore configuration failed, or was interrupted, the system will continue to prevent rekeying for the SVM. Use the REST API PATCH method "/api/security/key-stores/{uuid}" to re-run and complete the operation.
          - name: KEYMANAGER_MESSAGE_VSERVER_KEYSTORE_CONFIG_INITIALIZING_IN_PROGRESS_REKEY
            message: Rekey cannot be performed on the SVM while the enabled keystore configuration is being initialized. Wait until the keystore is in the active state, and rerun the rekey operation.
          - name: KEYMANAGER_MESSAGE_VSERVER_KEYSTORE_CONFIG_DISABLING_IN_PROGRESS_REKEY
            message: Rekey cannot be performed on the SVM while the enabled keystore configuration is being disabled.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

