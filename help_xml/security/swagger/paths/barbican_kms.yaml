/security/barbican-kms:
  x-ntap-long-description:
    tags: [ security ]
    description: |
      ## Overview
      Barbican Key Management Services (KMS) is a key management service that provides a secure store for encryption keys. This feature
      allows ONTAP to securely protect its encryption keys using Barbican KMS.
      Before you can use Barbican KMS with ONTAP, you must provide ONTAP with the necessary details to allow ONTAP to communicate with the deployed Barbican application.
      These details include the key ID URL, Keystone authentication URL, and the application credentials ID and secret.
      The property `barbican_reachability` is considered an advanced property and is populated only when explicitly requested.

      ## Examples
      ### Creating an inactive Barbican configuration for an SVM

      The example Barbican configuration is created for a specific SVM but is not enabled.
      Note the <i>return_records=true</i> query parameter can be used to return the newly created key-manager keystore configuration.<br/>
      ```
      # The API:
      POST /api/security/barbican-kms

      # The call:
      curl -X POST 'https://<mgmt-ip>/api/security/barbican-kms' -H 'accept: application/hal+json' -H 'Content-Type: application/json' -d '{ "svm": { "name": "barbican_svm" }, "configuration": {"name": "myConfiguration"}, "application_cred_id": "app1", "application_cred_secret": "secret1", "key_id": "https://sample.keyid.com:9311/v1/secrets/5c610a4f-ea97-44b5-8682-f4daeafa9647/", "keystone_url": "https://sample.keystone.com:5000/v3/auth/tokens" }'

      # The response:
      {
        "job": {
          "uuid": "5a208fb0-fa58-11ef-8c9f-005056bbeee5",
          "_links": {
            "self": {
              "href": "/api/cluster/jobs/5a208fb0-fa58-11ef-8c9f-005056bbeee5"
            }
          }
        }
      }
      ```
      ---
      ### Listing all Barbican configurations
      The following example shows how to retrieve a list of all created Barbican configurations.
      ```
      # The API:
      GET /api/security/barbican-kms
      # The call:
      curl -X GET 'https://<mgmt-ip>/api/security/barbican-kms'
      # The response:
      {
        "records": [
          {
            "configuration": {
              "name": "myConfiguration",
              "uuid": "5a134975-fa58-11ef-8c9f-005056bbeee5"
            },
            "uuid": "5a134975-fa58-11ef-8c9f-005056bbeee5",
            "_links": {
              "self": {
                "href": "/api/security/barbican-kms/5a134975-fa58-11ef-8c9f-005056bbeee5"
              }
            }
          }
        ],
        "num_records": 1,
        "_links": {
          "self": {
            "href": "/api/security/barbican-kms"
          }
        }
      }
      ```
      ---
      ### Retrieving a specific Barbican configuration
      The following example shows how to retrieve information for a specific Barbican configuration.
      ```
      # The API:
      GET /api/security/barbican-kms/{uuid}
      # The call:
      curl -X GET 'https://<mgmt-ip>/api/security/barbican-kms/5a134975-fa58-11ef-8c9f-005056bbeee5?fields=*'
      # The response:
      {
        "configuration": {
          "name": "myConfiguration",
          "uuid": "5a134975-fa58-11ef-8c9f-005056bbeee5"
        },
        "uuid": "5a134975-fa58-11ef-8c9f-005056bbeee5",
        "scope": "svm",
        "svm": {
          "uuid": "ec8e0954-fa10-11ef-8c9f-005056bbeee5",
          "name": "barbican_svm"
        },
        "key_id": "https://sample.keyid.com:9311/v1/secrets/5c610a4f-ea97-44b5-8682-f4daeafa9647/",
        "application_cred_id": "app1",
        "keystone_url": "https://sample.keystone.com:5000/v3/auth/tokens",
        "proxy_type": "https",
        "proxy_host": "",
        "proxy_port": 0,
        "proxy_username": "",
        "verify": true,
        "verify_host": true,
        "enabled": false,
        "timeout": 10,
        "_links": {
          "self": {
            "href": "/api/security/barbican-kms/5a134975-fa58-11ef-8c9f-005056bbeee5"
          }
        }
      }
      ```
      ---
      ### Retrieving an advanced property for a specific Barbican configuration
      The following example shows how to retrieve an advanced property for a specific Barbican configuration.
      ```
      # The API:
      GET /api/security/barbican-kms/{uuid}
      # The call:
      curl -X GET 'https://<mgmt-ip>/api/security/barbican-kms/f72098a2-e908-11ea-bd56-005056bb4222?fields=barbican_reachability'
      # The response:
      {
        "configuration": {
          "name": "myConfiguration",
          "uuid": "f72098a2-e908-11ea-bd56-005056bb4222"
        },
        "uuid": "f72098a2-e908-11ea-bd56-005056bb4222",
        "barbican_reachability": {
          "reachable": true,
          "message": "",
          "code": "0"
        },
        "_links": {
          "self": {
            "href": "/api/security/barbican-kms/f72098a2-e908-11ea-bd56-005056bb4222"
          }
        }
      }
      ```
      ---
      ### Updating the application credentials ID and secret for a specific Barbican configuration
      The following example shows how to update the application credentials for a specific Barbican configuration.
      ```
      # The API:
      PATCH /api/security/barbican-kms/{uuid}
      # The call:
      curl -X PATCH 'https://<mgmt-ip>/api/security/barbican-kms/f72098a2-e908-11ea-bd56-005056bb4222/' -d '{"application_cred_id": "app345", "application_cred_secret" : "secret"}'
      # The response:
      {
        "job": {
          "uuid": "921ee66a-fa5a-11ef-8c9f-005056bbeee5",
          "_links": {
            "self": {
              "href": "/api/cluster/jobs/921ee66a-fa5a-11ef-8c9f-005056bbeee5"
            }
          }
        }
      }
      ```
      ---
      ### Enabling a Barbican configuration
      The newly created Barbican configuration is inactive by default. Use the REST API PATCH method "/api/security/key-stores/{uuid}" to enable the configuration.
      <br/>
      ---
      ### Restoring keys
      The following example shows how to restore keys for a specific Barbican configuration.
      ```
      # The API:
      POST /api/security/barbican-kms/{uuid}/restore
      # The call:
      curl -X POST 'https://<mgmt-ip>/api/security/barbican-kms/f72098a2-e908-11ea-bd56-005056bb4222/restore'
      # The response:
      {
        "job": {
          "uuid": "e89e7283-2c49-11f0-831c-005056bb33a5",
          "_links": {
            "self": {
              "href": "/api/cluster/jobs/e89e7283-2c49-11f0-831c-005056bb33a5"
            }
          }
        }
      }
      ```
      ---
      ### Rekey the internal key
      The following example shows how to rekey the internal key based on a specific Barbican configuration.
      ```
      # The API:
      POST /api/security/barbican-kms/{uuid}/rekey-internal
      # The call:
      curl -X POST 'https://<mgmt-ip>/api/security/barbican-kms/f72098a2-e908-11ea-bd56-005056bb4222/rekey-internal'
      # The response:
      {
        "job": {
          "uuid": "921ee66a-fa5a-11ef-8c9f-005056bbeee5",
          "_links": {
            "self": {
              "href": "/api/cluster/jobs/921ee66a-fa5a-11ef-8c9f-005056bbeee5"
            }
          }
        }
      }
      ```
      ---

  post:
    tags: [ security ]
    description: |
      Creates a Barbican KMS configuration for the specified SVM.

      ### Required properties
      * `configuration.name` - Name for the new Barbican configuration.
      * `svm.uuid` or `svm.name` - Existing SVM in which to create a Barbican KMS.
      * `key_id` - Barbican key URL.
      * `keystone_url` - Keystone authentication URL.
      * `application_cred_id` - Keystone authentication application ID with access to the Barbican KMS.
      * `application_cred_secret`- Application credentials secret to authenticate the application credentials ID with Keystone.

      ### Optional properties
      * `proxy_type` - Type of proxy (http/https) if proxy configuration is used.
      * `proxy_host` - Proxy hostname if proxy configuration is used.
      * `proxy_port` - Proxy port number if proxy configuration is used.
      * `proxy_username` - Proxy username if proxy configuration is used.
      * `proxy_password` - Proxy password if proxy configuration is used.
      * `verify` - Verify the identity of the Barbican KMS?
      * `verify_host` - Verify the identity of the Barbican KMS host name?
      * `timeout` - Connection timeout in seconds.

      ### Related ONTAP commands
      * `security key-manager external barbican create-config`
    operationId: barbican_create
    parameters:
      - name: info
        in: body
        description: Info specification
        schema:
          $ref: "#/definitions/barbican"
    responses:
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et,license.et
          - name: KEYMANAGER_MESSAGE_BARBICAN_KMS_FEATURE_NOT_AVAILABLE
            message: Barbican Key Management Service (KMS) cannot be configured because not all nodes in the cluster are running an effective cluster version of 9.17 or later to support the Barbican KMS feature.
          - name: KEYMANAGER_MESSAGE_BARBICAN_KMS_CONFIG_ALREADY_EXISTS
            message: Failed to create the specified Barbican Key Management Service configuration because a Barbican Key Management Service configuration with the same name already exists.
          - name: KEYMANAGER_MESSAGE_BARBICAN_KMS_UNSUPPORTED_ON_CSERVER
            message: Barbican Key Management Service is not supported for the admin SVM.
          - name: KEYMANAGER_MESSAGE_BARBICAN_KMS_MCC_UNSUPPORTED
            message: Barbican Key Management Service is not supported in MetroCluster configurations.
          - name: KEYMANAGER_MESSAGE_BARBICAN_KMS_CREATE_INVALID_KEY_ID
            message: Failed to create a Barbican Key Management Service configuration because the "key-id" field is invalid or was not provided. The URI scheme must be HTTPS.
          - name: KEYMANAGER_MESSAGE_BARBICAN_KMS_CREATE_INVALID_KEYSTONE_URL
            message: Failed to create a Barbican Key Management Service configuration because the "keystone-url" field is invalid or was not provided. The URI scheme must be HTTPS.
          - name: KEYMANAGER_MESSAGE_BARBICAN_KMS_CREATE_EMPTY_APPLICATION_CRED_ID
            message: Failed to create a Barbican Key Management Service configuration because the "application-cred-id" field cannot be empty.
          - name: KEYMANAGER_MESSAGE_BARBICAN_KMS_CREATE_INVALID_CREDENTIALS
            message: Failed to create a Barbican Key Management Service configuration because the "application-cred-secret" field is invalid or was not provided.
          - name: LICENSE_V2_NOT_LICENSED_ERROR
            message: Package MT_EK_MGMT is not licensed in the cluster.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

  get:
    tags: [ security ]
    description: |
      Retrieves Barbican KMS configurations for all SVMs.

      ### Related ONTAP commands
      * `security key-manager external barbican show`
      * `security key-manager external barbican check`
    operationId: barbican_collection_get
    parameters:
      - x-ntap-autogen-params: barbican
      - $ref: "#/parameters/fields_param"
      - $ref: "#/parameters/max_records_param"
      - $ref: "#/parameters/return_timeout_get_param"
      - $ref: "#/parameters/return_records_get_param"
      - $ref: "#/parameters/order_by_param"
    responses:
      200:
        description: OK
        schema:
          $ref: "#/definitions/barbican_response"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_BARBICAN_REACHABILITY_FAILED_ON_NODES_REST
            message: The Barbican Key Management Service is unreachable from one or more nodes.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

/security/barbican-kms/{uuid}:
  get:
    tags: [ security ]
    description: |
      Retrieves the Barbican KMS configuration for the SVM specified by the UUID.

      ### Related ONTAP commands
      * `security key-manager external barbican show`
      * `security key-manager external barbican check`
    operationId: barbican_get
    parameters:
      - name: uuid
        in: path
        type: string
        description: Barbican KMS UUID
        required: true
      - $ref: "#/parameters/fields_param"
    responses:
      200:
        description: OK
        schema:
          $ref: "#/definitions/barbican"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_BARBICAN_REACHABILITY_FAILED_ON_NODES_REST
            message: The Barbican Key Management Service is unreachable from one or more nodes.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

  patch:
    tags: [ security ]
    description: |
      Updates the Barbican KMS configuration.

      ### Optional properties
      * `application_cred_id` - New credentials used to verify the application's identity to the Barbican KMS. You must provide both `application_cred_id` and `application_cred_secret` to update the credentials.
      * `application_cred_secret` - New credentials secret used to verify the application's identity to the Barbican KMS. You must provide both `application_cred_id` and `application_cred_secret` to update the credentials.
      * `proxy_type` - Type of proxy (http/https) if proxy configuration is used.
      * `proxy_host` - Proxy hostname if proxy configuration is used.
      * `proxy_port` - Proxy port number if proxy configuration is used.
      * `proxy_username` - Proxy username if proxy configuration is used.
      * `proxy_password` - Proxy password if proxy configuration is used.
      * `verify` - Verify the identity of the Barbican KMS?
      * `verify_host` - Verify the identity of the Barbican KMS host name?
      * `timeout` - Connection timeout in seconds.

      ### Related ONTAP commands
      * `security key-manager external barbican update-credentials`
      * `security key-manager external barbican update-config`

    operationId: barbican_modify
    parameters:
      - name: uuid
        in: path
        type: string
        description: Barbican KMS UUID
        required: true
      - name: info
        in: body
        description: Barbican KMS information
        schema:
          $ref: "#/definitions/barbican"
    responses:
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_BARBICAN_KMS_CRED_ID_SECRET_PAIR_INCOMPLETE_REST
            message: Both "application_cred_id" and "application_cred_secret" are required.
          - name: KEYMANAGER_MESSAGE_BARBICAN_KMS_CONFIG_NOT_FOUND
            message: Specified Barbican Key Management Service configuration does not exist.
          - name: KEYMANAGER_MESSAGE_BARBICAN_KMS_UPDATE_INVALID_ID
            message: Failed to update the Barbican Key Management Service configuration because the "application-cred-id" field is invalid or was not provided.
          - name: KEYMANAGER_MESSAGE_BARBICAN_KMS_UPDATE_INVALID_SECRET
            message: Failed to update the Barbican Key Management Service configuration because the "application-cred-secret" field is invalid or was not provided.
          - name: KEYMANAGER_MESSAGE_CUSTODIAN_CHECK_HEALTH_FAILED
            message: Failed to check the health of the Barbican Key Management Service.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

/security/barbican-kms/{uuid}/restore:
  post:
    tags: [ security ]
    description: |
      Restores the keys for an SVM from a configured Barbican KMS.

      ### Related ONTAP commands
      * `security key-manager external barbican restore`

    operationId: barbican_restore
    parameters:
      - name: uuid
        in: path
        type: string
        description: UUID of the existing Barbican KMS configuration.
        required: true
    responses:
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et
          - name: KEYMANAGER_MESSAGE_BARBICAN_KMS_NOT_CONFIGURED
            message: The Barbican Key Management Service is not configured.
          - name: KEYMANAGER_MESSAGE_ERR_RESTORE_SVMKEK_FAILED_SUMMARY
            message: Failed to restore the SVM-KEK on at least one node.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"

/security/barbican-kms/{uuid}/rekey-internal:
  post:
    tags: [ security ]
    description: |
      Rekeys the internal key in the key hierarchy for an SVM with a Barbican KMS configuration.

      ### Related ONTAP commands
      * `security key-manager external barbican rekey-internal`

    operationId: barbican_rekey_internal
    parameters:
      - name: uuid
        in: path
        type: string
        description: UUID of the existing Barbican KMS configuration.
        required: true
    responses:
      202:
        description: Accepted
        schema:
          $ref: "#/definitions/job_link_response"
        x-ntap-go-skip-action: true
      default:
        description: |
          - x-ntap-error-table-start: keymanager_messages.et,volume_encryption.et
          - name: KEYMANAGER_MESSAGE_BARBICAN_KMS_NOT_CONFIGURED
            message: The Barbican Key Management Service is not configured.
          - name: KEYMANAGER_MESSAGE_NO_KMS_CONFIGURED
            message: No Key Management Service configured.
          - name: KEYMANAGER_MESSAGE_REKEY_AFTER_BLOCKED
            message: ONTAP is unable to encrypt or decrypt because the configured external key manager is in a blocked state. Possible reasons for a blocked state include the top-level external key protection key is not found, disabled or has insufficient privileges. Resolve the external key manager key issues at the key manager's portal before running the rekey operation.
          - name: KEYMANAGER_MESSAGE_REKEY_AFTER_MIGRATION_REST
            message: One or more volume encryption keys (VEKs) for this data SVM's encrypted volumes are stored in the key manager configured for the admin SVM. Use the REST API POST method "/api/security/key-managers/{source.svm.uuid}/migrate" to migrate these keys from the admin SVM's key manager to this data SVM's key manager before running the rekey operation.
          - name: KEYMANAGER_MESSAGE_VSERVER_KEYSTORE_CONFIG_SWITCH_IN_PROGRESS_REKEY_REST
            message: Rekey cannot be performed while the enabled keystore configuration is being switched. If a previous attempt to switch the keystore configuration failed, or was interrupted, the system will continue to prevent rekeying. Use the REST API PATCH method "/api/security/key-stores/{uuid}" to re-run and complete the operation.
          - name: KEYMANAGER_MESSAGE_VSERVER_KEYSTORE_CONFIG_INITIALIZING_IN_PROGRESS_REKEY
            message: Rekey cannot be performed while the enabled keystore configuration is being initialized. Wait until the keystore is in the active state, and rerun the rekey operation.
          - name: KEYMANAGER_MESSAGE_VSERVER_KEYSTORE_CONFIG_DISABLING_IN_PROGRESS_REKEY
            message: Rekey cannot be performed while the enabled keystore configuration is being disabled.
          - name: KEYMANAGER_MESSAGE_CUSTODIAN_MISSING_KVSTORE
            message: The key custodian not provided with an external key value store.
          - name: KEYMANAGER_MESSAGE_FAILED_TO_PARSE_VALUE
            message: Internal error. Failed to parse the key value store response.
          - name: KEYMANAGER_MESSAGE_CUSTODIAN_DECRYPT_FAILED
            message: Failed to decrypt.
          - name: KEYMANAGER_MESSAGE_SVM_KEK_KERNEL_IMPORT_FAILED
            message: Failed to import the SVM-KEK.
          - name: KEYMANAGER_MESSAGE_ERR_KEYGEN_SVM_CRYPTO_FAILED
            message: Internal error. Failed to generate SVM key in the kernel.
          - name: KEYMANAGER_MESSAGE_ERR_GET_UNWRAPPED_SVMKEK
            message: Internal error. Failed to unwrap SVM key encryption key.
          - name: KEYMANAGER_MESSAGE_CUSTODIAN_ENCRYPT_FAILED
            message: Failed to encrypt.
          - name: KEYMANAGER_MESSAGE_ERR_VOL_KEY_ID_MISSING
            message: Internal error. Volume encryption key is missing.
          - name: KEYMANAGER_MESSAGE_ERR_VOL_UUID_MISSING
            message: Internal error. UUID is missing.
          - name: KEYMANAGER_MESSAGE_ERR_VOL_DSID_MISSING
            message: Internal error. Volume DSID is missing.
          - name: KEYMANAGER_MESSAGE_ERR_VOL_KEY_ID_INVALID
            message: Internal error. Volume encryption key is invalid.
          - name: KEYMANAGER_MESSAGE_ERR_VOL_VDEK_BLOB_INVALID
            message: Internal error. Volume has invalid encryption blob.
          - name: KEYMANAGER_MESSAGE_ERR_VOL_VDEK_BLOB_UPDATE
            message: Internal error. Failed to update the VDEK blob.
          - name: KEYMANAGER_MESSAGE_REKEY_CUSTODIAN_MISSING_KEYID
            message: New Key ID not found.
          - name: VOLUME_ENCRYPTION_RDB_LOOKUP_FAILED
            message: Internal error. Failed to get encryption operation status.
          - name: VOLUME_ENCRYPTION_ERR_VOL_VDEK_BLOB_MISSING
            message: Internal error. The encryption blob was not found in the RDB table.
          - name: KEYMANAGER_MESSAGE_SVM_KEK_REKEY_INTERNAL_FAIL_RESTORE_FAIL
            message: During the rekey internal operation, a restore operation failed.
          - x-ntap-error-table-end: END
        schema:
          $ref: "#/definitions/error_response"
