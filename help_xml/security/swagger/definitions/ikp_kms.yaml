ikp_kms_key:
  type: object
  properties:
    scope:
      readOnly: true
      $ref: '#/INLINE_REF/definitions/network_scope'
    svm:
      $ref: "#/INLINE_REF/definitions/svm_reference"
    key_id:
      type: string
      x-ntap-readCreate: true
      description: Key identifier of the IKP KMS key encryption key.
      example: "12345678-1234-1234-1234-123456789101"

ikp_kms_state:
  x-ntap-visibility:
    type: private
  description: |
     Indicates whether the IBM Key Protect service is available cluster-wide.
  type: object
  x-ntap-readOnly: true
  properties:
    cluster_state:
      type: boolean
      description: Set to true when the IBM Key Protect service is available on all nodes of the cluster.
    message:
      type: string
      description: Error message set when cluster availability is false.
      example: IBM Key Protect service is unavailable in following nodes - node1, node2.
    code:
      type: string
      description: Code corresponding to the status message. Returns a _0_ if the IBM Key Protect Key Management Service is available in all nodes of the cluster.
      example: "346758"

ikp_connectivity:
  description: |
     Indicates whether or not the IBM Key Protect KMS is reachable from all nodes in the cluster.
     This is an advanced property; there is an added computational cost to retrieving its value. The property is not populated for either a collection GET or an instance GET unless it is explicitly requested using the `fields` query parameter or GET for all advanced properties is enabled.
  type: object
  x-ntap-readOnly: true
  properties:
    reachable:
      type: boolean
      description: Set to true if the IBM Key Protect KMS is reachable from all nodes of the cluster.
    message:
      type: string
      description: Set to the error message when 'reachable' is false.
      example: "IBM Key Protect KMS is not reachable from all nodes - <reason>."
    code:
      type: string
      description: Code corresponding to the error message. Returns a 0 if IBM Key Protect KMS is reachable from all nodes in the cluster.
      example: "346758"

ekmip_server_connectivity:
  description: |
     Provides the connectivity status for the given SVM on the given node to all EKMIP servers configured on all nodes of the cluster.
     This is an advanced property; there is an added computational cost to retrieving its value. The property is not populated for either a collection GET or an instance GET unless it is explicitly requested using the `fields` query parameter or GET for all advanced properties is enabled.
  type: object
  x-ntap-readOnly: true
  properties:
    node:
      $ref: "#/INLINE_REF/definitions/node_reference"
    reachable:
      type: boolean
      description: Set to true if the given SVM on the given node is able to communicate to all EKMIP servers configured on all nodes in the cluster.
    message:
      type: string
      description: Error message set when cluster-wide EKMIP server availability from the given SVM and node is false.
      example: "embedded KMIP server status unavailable on node."
    code:
      type: string
      description: Code corresponding to the error message. Returns a 0 if a given SVM is able to communicate to the EKMIP servers of all of the nodes in the cluster.
      example: "346758"

ikp_kms:
  x-ntap-visibility:
    type: private
  type: object
  properties:
    uuid:
      type: string
      readOnly: true
      description: A unique identifier for the IBM Key Protect service.
      example: 1cd8a442-86d1-11e0-ae1c-123478563412
    scope:
      readOnly: true
      $ref: '#/INLINE_REF/definitions/network_scope'
    svm:
      $ref: "#/INLINE_REF/definitions/svm_reference"
    region:
      type: string
      description: IBM region of the IBM Key Protect service.
      example: "us-south"
    instance_id:
      type: string
      description: Instance ID for the IBM Key Protect service.
      example: "1a0ec336-f391-4091-a6fb-5e084a4c56f4"
    key_id:
      type: string
      description: IBM Key Protect service key ID.
      example: "key1"
    api_key:
      type: string
      x-ntap-writeOnly: true
      description: IBM service ID API key.
      format: password
      example: "12345678-1234-1234-1234-1234567890ab"
    port:
      type: integer
      description: IBM Key Protect service port.
      example: 443
    proxy_type:
      type: string
      description: Proxy type. Valid values are http, https.
      enum:
        - http
        - https
      example: http
    proxy_host:
      type: string
      description: Proxy host.
      example: "proxy.eng.com"
    proxy_port:
      type: integer
      description: Proxy port.
      example: 1234
    proxy_username:
      type: string
      description: Proxy username.
      # cSpell:disable-next-line
      example: "proxyuser"
    proxy_password:
      type: string
      x-ntap-writeOnly: true
      description: Proxy password. Password is not audited.
      # cSpell:disable-next-line
      example: "ikpkze-Jwjje2-WJJPer"
    state:
      $ref: "#/INLINE_REF/definitions/ikp_kms_state"
    ikp_reachability:
      $ref: "#/INLINE_REF/definitions/ikp_connectivity"
    ekmip_reachability:
      type: array
      items:
        $ref: "#/INLINE_REF/definitions/ekmip_server_connectivity"
    polling_period:
      type: integer
      description: Polling period (in minutes).
      example: 55
    timeout:
      type: integer
      description: IBM Key Protect connection timeout (in seconds).
      example: 20
    verify:
      type: boolean
      description: Set to true to verify the IBM Key Protect service host.
      example: false
    verify_host:
      type: boolean
      description: Set to true to verify the IBM Key Protect service host's hostname.
      example: true
    verify_ip:
      type: boolean
      description: Set to true to verify the IBM Key Protect service host's IP address.
      example: false
    oauth_host:
      type: string
      description: IBM Key Protect service authorization host.
      example: "ikp-auth-host.host.com"
    _links:
      $ref: "#/INLINE_REF/definitions/self_link"

ikp_kms_response:
  x-ntap-visibility:
    type: private
  type: object
  properties:
    records:
      type: array
      items:
        $ref: "#/definitions/ikp_kms"
    num_records:
      type: integer
      description: Number of records
      example: 1
    _links:
      $ref: "#/INLINE_REF/definitions/collection_links"
