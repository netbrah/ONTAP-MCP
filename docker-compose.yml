version: '3.8'

services:
  # NetApp ONTAP Key Manager MCP Server (FastMCP HTTP SSE)
  ontap-keymanager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ontap-keymanager-mcp
    ports:
      - "3000:3000"
    environment:
      # ONTAP Cluster Configuration (REQUIRED)
      - ONTAP_CLUSTER_IP=${ONTAP_CLUSTER_IP}
      - ONTAP_USERNAME=${ONTAP_USERNAME:-admin}
      - ONTAP_PASSWORD=${ONTAP_PASSWORD}
      
      # Server Configuration
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge

# ============================================================================
# Usage Instructions
# ============================================================================
#
# 1. Create a .env file with your ONTAP cluster credentials:
#    
#    ONTAP_CLUSTER_IP=10.1.1.1
#    ONTAP_USERNAME=admin
#    ONTAP_PASSWORD=yourpassword
#
# 2. Start the service:
#    
#    docker-compose up -d
#
# 3. Access the MCP server:
#    
#    HTTP SSE endpoint: http://localhost:3000/sse
#    Health check:      http://localhost:3000/health
#
# 4. View logs:
#    
#    docker-compose logs -f
#
# 5. Stop the service:
#    
#    docker-compose down
#
# ============================================================================
# Available Key Manager Tools (13)
# ============================================================================
#
# Key Manager Management:
#   - list_key_managers
#   - get_key_manager
#   - create_external_key_manager
#   - create_onboard_key_manager
#   - update_key_manager_passphrase
#   - sync_key_manager
#   - delete_key_manager
#
# Key Server Management:
#   - list_key_servers
#   - add_key_server
#   - delete_key_server
#
# Key Operations:
#   - list_keys
#   - create_auth_key
#   - restore_keys
#
# ============================================================================
